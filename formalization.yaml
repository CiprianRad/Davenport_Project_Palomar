      - "Claudiu G. Pop"
      - "George C. Rad"
      - "George C. Țurcaș"
    type: "paper"
    id: "arXiv:2611.20197"
    relationship: "formalizes"
    note: >-
      The formalization follows the paper section by section and uses the theorem numbers of its
      arXiv version. Its authors are the authors of the paper. The supplement to the paper
      (supplement.pdf in this repository) gives the certificate counts, works through the
      eighteen-term example, and explains how to replay the Lean checks. The repository that the
      paper cites, https://github.com/CiprianRad/Davenport_Project, has the same formalization
      without the files made for Palomar.
    author_endorsement: "participated"
  - title: "A combinatorial problem on finite Abelian groups. I"
    authors: ["J. E. Olson"]
    type: "paper"
    id: "doi:10.1016/0022-314X(69)90021-3"
    location: "J. Number Theory 1 (1969), 8-10"
    relationship: "background"
    note: >-
      The Davenport constant of finite abelian p-groups. Olson's theorem is also proved in this
      formalization (DavenportProject.davenport_pi_zmod_prime_pow), by the group-ring argument of
      Section 3 of the paper.
  - title: "A combinatorial problem on finite Abelian groups. II"
    authors: ["J. E. Olson"]
    type: "paper"
    id: "doi:10.1016/0022-314X(69)90037-7"
    location: "J. Number Theory 1 (1969), 195-199"
    relationship: "background"
  - title: "A combinatorial problem on finite abelian groups. III"
    authors: ["P. van Emde Boas", "D. Kruyswijk"]
    type: "other"
    location: "Report ZW 8/69, Mathematisch Centrum, Amsterdam, 1969; https://ir.cwi.nl/pub/7217"
    relationship: "background"
    note: "Classical families (doubled p-groups, tripled 2-groups) contained in Corollary C."
  - title: >-
      The inverse problem associated to the Davenport constant for C_2 ⊕ C_2 ⊕ C_2n, and
      applications to the arithmetical characterization of class groups
    authors: ["W. A. Schmid"]
    type: "paper"
    id: "doi:10.37236/520"
    location: "Electron. J. Combin. 18(1) (2011), Paper P33"
    relationship: "background"
    note: "Earlier rank-three results; covers D(C_n^3) for n = 2p^a."
  - title: "An asymptotically tight bound for the Davenport constant"
    authors: ["B. Girard"]
    type: "paper"
    id: "doi:10.5802/jep.79"
    location: "J. Éc. polytech. Math. 5 (2018), 605-611"
    relationship: "background"
    note: "Earlier rank-three results; covers D(C_n^3) for n = 3·2^a."
  - title: "Zero-sum problems in finite abelian groups: a survey"
    authors: ["W. Gao", "A. Geroldinger"]
    type: "paper"
    id: "doi:10.1016/j.exmath.2006.07.002"
    location: "Expo. Math. 24 (2006), 337-369"
    relationship: "background"
    note: "Background on the conjecture D(C_n^3) = 3n - 2."

related_formalizations: []

status:
  scope: >-
    Formalized: the definitions of zero sets, incidence identities, separators, the Davenport
    constant D(G), the invariants κ_t(G; K) and η(G); Lemmas 2.1, 2.2, 3.1, 5.1, 5.2 and 5.3;
    Proposition 4.1; Theorems A and B; Corollary C with its numerical instances; Remarks 3.2 and
    4.2; the worked example of Section 5.3; Olson's theorem for finite abelian p-groups and the
    bound η(C_4^3) ≤ 22, which the paper quotes. Not formalized: Remark 3.3, the conjecture (1.1),
    and D* as a definition of its own (the lower bounds the proofs use are formalized).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5.5"
        - "other Anthropic and OpenAI models run by subagents (not tracked)"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code running Claude Opus 5.5 with the LeanAutoformalizationSkills skill collection
        (https://github.com/scottnarmstrong/LeanAutoformalizationSkills). The main agent launched
        subagents, some of which may have run other Anthropic or OpenAI models; which model did
        which task was not tracked, so the division of the work between them is not known.
      cost:
        wall_time: "not tracked (many sessions of different length)"
        spend_usd: "not tracked"
        hardware: "hosted models; a local machine for builds and enumerations"
    - method: "manual"
      tool_setup: >-
        The authors chose the formal statements, checked them against the paper and reviewed the
        formalization.
  spend_usd: "not tracked"
  notes: >-
    The Lean formalization was produced with Claude Code (Claude Opus 5.5) and its subagents,
    under the supervision of the authors. For the paper itself, its AI disclosure applies: large
    language models (OpenAI's Codex and ChatGPT, Anthropic's Claude) were used in an essential way,
    in the exploration that led to the incidence identities, in coding the enumeration programs, in
    writing and revising the exposition and the proofs, and in a substantial part of the Lean
    formalization. Every argument was checked by at least one author, and the authors take full
    responsibility for the paper and for this formalization.

fidelity:
  divergences: >-
    Lemma 5.1(1) and Lemma 5.3 rest on finite enumerations; the paper describes its own in
    Appendix A, while the Lean proof uses another normal form (the standard basis vectors are
    chosen among the terms of largest multiplicity), proves inside Lean that its enumeration misses
    nothing, and has it checked by Lean's kernel. The reductions before the enumerations are those
    of the paper, and the orbit counts of the hard cases of Lemma 5.3 agree with the paper (6,963
    and 64). Two results that the paper quotes, Olson's theorem and η(C_4^3) ≤ 22, are proved here.
    Sequences are indexed families u : ι → G, so equal terms at different positions are different
    terms, as in the paper.

review:
  status: "author-verified"
  reviewers:
    - "Claudiu G. Pop"
    - "George C. Rad"
    - "George C. Țurcaș"
  notes: >-
    The authors approved the formal statements of the 76 declarations listed in statements.json;
    scripts/check_statements.py checks that their elaborated statements are unchanged and that they
    depend only on the standard axioms. The formalization was also audited by AI agents. This is
    not an independent peer review.

