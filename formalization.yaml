    - source: "Corollary C, D(C_15^3) = 43"
      lean: "DavenportProject.davenport_cube_fifteen"
      module: "DavenportProject.CorollaryC"
      status: "proved"
    - source: "Corollary C, D(C_20^3) = 58"
      lean: "DavenportProject.davenport_cube_twenty"
      module: "DavenportProject.CorollaryC"
      status: "proved"
    - source: "Lemma 5.3, fourteen terms"
