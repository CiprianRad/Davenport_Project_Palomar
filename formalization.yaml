      module: "DavenportProject.TheoremB"
      status: "proved"
    - source: "Theorem B (value of κ_t)"
      lean: "DavenportProject.kappa_cube_eq"
      module: "DavenportProject.TheoremB"
      status: "proved"
    - source: "Corollary C"
