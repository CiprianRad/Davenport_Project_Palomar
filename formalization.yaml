    - source: "Theorem A (integral identities)"
      lean: "DavenportProject.davenport_prod_le_of_hasIncidenceIdentity_int"
      module: "DavenportProject.Transfer.TheoremA"
      status: "proved"
    - source: "Theorem B (identities)"
