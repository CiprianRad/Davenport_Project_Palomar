# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Integral zero-sum incidence identities and Davenport constants in rank three"
  description: >-
    A Lean 4 formalization of the paper of C. G. Pop, G. C. Rad and G. C. Țurcaș on the Davenport
    constant of finite abelian groups of rank three. An incidence identity of degree t of a
    sequence is a family of coefficients indexed by its zero-sum subsequences whose sum is one and
    whose moments of degree 1 to t vanish. Theorem A (a transfer principle): if every sequence of
    L(t) terms over a finite abelian group Q has such an identity over F_p, or over the integers,
    then D(Q ⊕ H) ≤ L(D(H) − 1) for every finite abelian p-group H. Theorem B: for m = 2, 3, 4,
    every sequence of m(t + 3) − 2 terms over C_m^3 has an integral identity of degree t, and the
    invariant κ_t(C_m^3; K) equals m(t + 3) − 2 for every field K of characteristic zero or prime
    to m. Corollary C: D(C_{mp^a} ⊕ C_{mp^b} ⊕ C_{mp^c}) = m(p^a + p^b + p^c) − 2 for m = 2, 3, 4,
    every prime p not dividing m and 0 ≤ a ≤ b ≤ c; in particular D(C_15^3) = 43 and
    D(C_20^3) = 58. All lemmas, propositions, theorems and corollaries of the paper are formalized.
    The computer-assisted Lemmas 5.1(1) and 5.3 are checked by Lean's kernel, and every result
    depends only on the axioms propext, Classical.choice and Quot.sound.
  authors:
    - "Claudiu G. Pop"
    - "George C. Rad"
    - "George C. Țurcaș"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Claudiu G. Pop"
    - "George C. Rad"
    - "George C. Țurcaș"

classification:
  arxiv: ["math.NT", "math.CO"]
  msc2020: ["11B75", "11P70", "20K01"]

sources:
